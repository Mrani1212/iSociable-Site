kind = "web"
previewPath = "/"
title = "iSociable"
description = "A polished responsive marketing website for iSociable, an influencer marketing agency connecting ambitious brands with aligned creators for authentic, measurable campaigns."
version = "1.0.0"
id = "artifacts/isociable-website"
router = "path"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 18816

[services.development]
run = "pnpm --filter @workspace/isociable-website run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/isociable-website", "run", "build" ]
serve = "static"
publicDir = "artifacts/isociable-website/dist/public"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "18816"
BASE_PATH = "/"
